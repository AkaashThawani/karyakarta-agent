name: 🚀 Deploy KaryaKarta Backend to GCP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: karyakarta-478520
  GCP_REGION: us-central1
  SERVICE_NAME: karyakarta-agent

jobs:
  # Test Backend
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # Add your actual test commands here
          python -c "import sys; sys.path.append('.'); from src.core.agent import Agent; print('✅ Backend imports work')"
          echo "Tests completed"

  # Deploy Backend to GCP Cloud Run
  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Enable required APIs
        run: |
          gcloud services enable cloudbuild.googleapis.com run.googleapis.com containerregistry.googleapis.com secretmanager.googleapis.com --project ${{ env.GCP_PROJECT_ID }}

      - name: Build and Push Docker Image
        run: |
          echo "🏗️ Building Docker image..."
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest .

          echo "📤 Pushing to Google Container Registry..."
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --concurrency 80 \
            --set-env-vars ENVIRONMENT=production,HEADLESS=true \
            --update-secrets GEMINI_API_KEY=gemini-api-key:latest,SERPER_API_KEY=serper-api-key:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_KEY=supabase-key:latest,BROWSERLESS_API_KEY=browserless-api-key:latest \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Get Backend URL
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)' --project ${{ env.GCP_PROJECT_ID }})
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Backend deployed at: $BACKEND_URL"

      - name: Test Backend Deployment
        run: |
          BACKEND_URL="${{ steps.backend-url.outputs.backend_url }}"
          echo "🧪 Testing backend at: $BACKEND_URL"
          curl -f -m 30 $BACKEND_URL/health || (echo "❌ Backend health check failed" && exit 1)
          echo "✅ Backend is healthy!"

  # Post-deployment notification
  notify:
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "🎉 Backend deployment completed!"
          echo "📊 Status: ${{ needs.deploy-backend.result }}"
          echo "🔗 Backend: ${{ needs.deploy-backend.outputs.backend-url }}"
